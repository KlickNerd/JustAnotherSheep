<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PEACEHOLD — Just Another Sheep</title><style>
:root{--bg:#191916;--panel:#e9ddc7;--gold:#dfb875}*{box-sizing:border-box}body{margin:0;background:#111;color:#f3e9d8;font:15px system-ui,-apple-system,sans-serif}.app{max-width:750px;margin:auto;background:var(--bg);min-height:100dvh}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px;background:#30271f;position:sticky;top:0;z-index:3;font-size:13px;border-bottom:1px solid #8e704d}.res{display:flex;gap:11px;flex-wrap:wrap;font-weight:700}h1,h2,h3{font-family:Georgia,serif}h1{margin:0}nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#30271f;border-top:1px solid #8e704d;padding-bottom:env(safe-area-inset-bottom)}nav button{padding:12px 0;color:#e5d7bf;background:transparent;border:0;font-size:12px}nav button.active{background:#6f5133;color:#fff}.scene{min-height:68dvh;position:relative;overflow:hidden;background:radial-gradient(circle at 73% 15%,#fff8c6 0,#eac78a 13%,transparent 40%),linear-gradient(#92bdcb 0%,#f2d3a2 42%,#7ea66e 43%,#4e7350 100%)}.hills{position:absolute;top:38%;height:28%;width:150%;left:-25%;border-radius:50% 50% 0 0;background:#88aa75}.path{position:absolute;bottom:-10%;left:20%;width:60%;height:68%;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);background:#cbb18b}.tower{position:absolute;left:43%;top:24%;width:16%;height:39%;background:#ece1c6;border:7px solid #877965;text-align:center;font-size:32px;padding-top:7%;box-shadow:0 -28px #4d4138}.barn{position:absolute;top:47%;width:29%;height:26%;background:#b8a58c;border:5px solid #5d5345;clip-path:polygon(0 30%,50% 0,100% 30%,100% 100%,0 100%)}.barn.left{left:3%}.barn.right{right:3%}.pin{position:absolute;background:#2d241ddd;border:1px solid #bd9e6c;color:#fff0d7;border-radius:8px;padding:11px;box-shadow:0 5px 10px #0004;font-weight:bold}.pin.a{top:21%;left:29%}.pin.b{top:52%;left:3%}.pin.c{top:55%;right:3%}.pin.d{bottom:18%;left:7%}.pin.e{bottom:17%;right:6%}.herohead{position:relative;text-align:center;padding:24px 10px 0;color:#281f17;text-shadow:0 1px #f8e6c3}main{min-height:72dvh}.meters{padding:9px 12px;background:#322820;display:flex;gap:15px;font-size:12px;justify-content:center}.intro{padding:17px;background:#29221c}.section{padding:18px}.card{background:var(--panel);color:#30271f;margin:12px 0;padding:17px;border:1px solid #b9a07c;border-radius:10px}.card p{line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{border:1px solid #9f7443;border-radius:8px;padding:11px 14px;background:var(--gold);color:#302316;font-weight:750;cursor:pointer}.btn:disabled{opacity:.4}.btn.alt{background:#4f5743;color:white}.btn.red{background:#9e6455;color:white}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{white-space:nowrap}.big{font-size:35px}.muted{color:#baa98e;font-size:12px}.card .muted{color:#776857}.meter{height:8px;background:#a8a08d;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:#6f9765}.status{padding:12px;color:#ffe0a4}#alert{position:fixed;z-index:10;bottom:74px;left:10%;width:80%;background:#18221c;border:1px solid #9f8b61;padding:13px;border-radius:8px;text-align:center}[hidden]{display:none!important}
</style><div class="app"><header><div><b>🐑 <span id="name">Sheep #127</span></b><div class="muted" id="lvl">Lv 1</div></div><div class="res"><span>🌿 <b id="grass"></b></span><span>☁️ <b id="wool"></b></span><span>🪙 <b id="coins"></b></span><span>⚡ <b id="energy"></b></span></div></header><main id="main"></main><nav id="nav"></nav></div><div id="alert" hidden></div><script>
const K="peacehold-mobile-v1",initial={level:1,xp:0,grass:90,wool:12,coins:220,energy:100,awareness:5,suspicion:0,influence:10,stall:1,skills:{Wit:1,Grit:1,Charm:1,Sneak:1},herd:false,vote:null,job:null,last:Date.now()};
let s;try{s={...initial,...JSON.parse(localStorage.getItem(K))}}catch{s={...initial}}let page="Farm",category="All";const jobs=[["Gather Grass","Civic",12,5,{grass:50,wool:2},15],["Deliver Wool Tax","Loyalist",20,10,{coins:130,influence:8},20],["Clean Bell Tower","Civic",18,8,{coins:100},18],["Distribute Approved Pamphlets","Loyalist",24,10,{coins:150,influence:12},25],["Pass a Hidden Message","Underground",30,15,{coins:170,awareness:12,suspicion:8},30]];
function save(){localStorage.setItem(K,JSON.stringify(s))}function toast(t){let a=document.querySelector("#alert");a.textContent=t;a.hidden=false;setTimeout(()=>a.hidden=true,3100)}function tick(){let n=Date.now(),gain=Math.floor((n-s.last)/60000);if(gain>0){s.energy=Math.min(100,s.energy+gain);s.last+=gain*60000}if(s.job&&n>=s.job.end){let j=jobs[s.job.id];Object.entries(j[4]).forEach(([k,v])=>s[k]=(s[k]||0)+v);s.xp+=j[5];while(s.xp>=s.level*100){s.xp-=s.level*100;s.level++;s.energy=Math.min(100,s.energy+15)}s.job=null;toast("Job complete! Rewards collected.")}save()}function meter(t,v){return '<span>'+t+' '+v+'/100</span><div class="meter"><i style="width:'+v+'%"></i></div>'}function main(){tick();["grass","wool","coins","energy"].forEach(k=>document.getElementById(k).textContent=s[k]);document.getElementById("lvl").textContent="Lv "+s.level+" · "+s.xp+"/"+s.level*100+" XP";document.getElementById("nav").innerHTML=[["Farm","🏡"],["Society","🏛️"],["Jobs","⚒️"],["Sheep","🐑"],["Herd","🤝"]].map(([t,e])=>'<button class="'+(page===t?'active':'')+'" onclick="go(\''+t+'\')">'+e+'<br>'+t+'</button>').join('');document.getElementById("main").innerHTML=({Farm:farm,Society:society,Jobs:jobpage,Sheep:sheep,Herd:herd})[page]()}function go(x){page=x;main();window.scrollTo(0,0)}
function farm(){return '<div class="scene"><div class="hills"></div><div class="path"></div><div class="barn left"></div><div class="barn right"></div><div class="tower">🔔</div><div class="herohead"><small>PEACEHOLD PRESENTS</small><h1>JUST ANOTHER SHEEP</h1><b>A safer flock. A brighter tomorrow.</b></div><button class="pin a" onclick="go(\'Society\')">Bell Tower</button><button class="pin b" onclick="go(\'Jobs\')">Market</button><button class="pin c" onclick="go(\'Society\')">Tax Office</button><button class="pin d" onclick="go(\'Sheep\')">Your Stall</button><button class="pin e" onclick="go(\'Herd\')">The Open Gate</button></div><div class="meters">'+meter("Awareness",s.awareness)+meter("Suspicion",s.suspicion)+'</div><div class="intro"><h3>🔔 Official Announcement</h3>The Shepherd is pleased to announce a proposal to increase wool taxes by 5%. <button class="btn" onclick="go(\'Society\')">Vote now</button></div>'}
function jobpage(){return '<div class="section"><h1>Jobs & Chores</h1><p class="muted">Test timers run in seconds. Only one job can run at a time.</p>'+(s.job?'<div class="card"><b>Working: '+jobs[s.job.id][0]+'</b><p>Remaining: '+Math.max(0,Math.ceil((s.job.end-Date.now())/1000))+' seconds</p></div>':'')+'<div class="tabs">'+["All","Civic","Loyalist","Underground"].map(x=>'<button class="btn '+(x===category?'':'alt')+'" onclick="category=\''+x+'\';main()">'+x+'</button>').join('')+'</div>'+jobs.map((j,i)=>category!=="All"&&j[1]!==category?"":'<div class="card"><div class="row"><h3>'+j[0]+'</h3><span>'+j[1]+'</span></div><p>⏱️ '+j[2]+'s · ⚡ '+j[3]+' energy</p><p>Rewards: '+Object.entries(j[4]).map(([k,v])=>'+'+v+' '+k).join(' · ')+' · +'+j[5]+' XP</p><button class="btn" '+(s.job||s.energy<j[3]?'disabled':'')+' onclick="start('+i+')">Start job</button></div>').join('')+'</div>'}
function start(i){tick();let j=jobs[i];if(s.job||s.energy<j[3])return;s.energy-=j[3];s.job={id:i,end:Date.now()+j[2]*1000};save();main();toast("The Shepherd appreciates your productivity.")}
function society(){return '<section class="section"><h1>🏛️ Weekly Assembly</h1><div class="card"><h2>Raise Wool Tax by 5%</h2><p>For infrastructure, public happiness, and absolutely necessary extra watchtowers.</p><p>“All sheep have a voice. Some voices are more official.”</p><div class="row"><button class="btn alt" '+(s.vote?'disabled':'')+' onclick="vote(\'Support\')">Support</button><button class="btn red" '+(s.vote?'disabled':'')+' onclick="vote(\'Oppose\')">Oppose</button><button class="btn" '+(s.vote?'disabled':'')+' onclick="vote(\'Manipulate\')">Manipulate</button></div><p>'+ (s.vote?'Your choice: '+s.vote:'Choose carefully. The Shepherd is watching.')+'</p><p class="muted">Simulated local vote. Online multiplayer elections are not implemented.</p></div><div class="card"><h3>Your Influence</h3><div class="big">'+s.influence+'</div><p>Awareness: '+s.awareness+' · Suspicion: '+s.suspicion+'</p></div><div class="card"><h3>Civic Roles</h3><p>🔔 Bell Keeper (20 Influence)</p><p>🧾 Tax Collector (80 Influence)</p><p>📜 Council Clerk (150 Influence)</p><p>👑 Council Speaker (500 Influence)</p></div></section>'}
function vote(c){if(s.vote)return;s.vote=c;if(c==="Support"){s.influence+=12;s.coins+=40}else if(c==="Oppose"){s.influence+=18;s.awareness+=10;s.suspicion+=5}else{s.influence+=30;s.suspicion+=20;s.coins=Math.max(0,s.coins-35)}s.awareness=Math.min(100,s.awareness);s.suspicion=Math.min(100,s.suspicion);save();main();toast("Your choice has been officially recorded.")}
function sheep(){return '<section class="section"><h1>🐑 Your Sheep</h1><div class="card"><h2>Questioning Worker · Lv '+s.level+'</h2><p>Same flock. Different path.</p><p>Influence: '+s.influence+' · Stall Lv '+s.stall+'</p></div><h2>Training</h2>'+Object.entries(s.skills).map(([k,v])=>'<div class="card row"><b>'+k+' · '+v+'</b><button class="btn" '+(s.coins<50*v?'disabled':'')+' onclick="train(\''+k+'\')">Train · 🪙 '+50*v+'</button></div>').join('')+'<div class="card"><h3>Your Stall · Lv '+s.stall+'</h3><p>Your quiet space to rest and question the bell.</p><button class="btn" '+(s.grass<50*s.stall||s.coins<80*s.stall?'disabled':'')+' onclick="upgrade()">Upgrade · 🌿 '+50*s.stall+' / 🪙 '+80*s.stall+'</button></div></section>'}
function train(k){let c=50*s.skills[k];if(s.coins<c)return;s.coins-=c;s.skills[k]++;s.influence+=2;save();main();toast("Training complete!")}function upgrade(){let g=50*s.stall,c=80*s.stall;if(s.grass<g||s.coins<c)return;s.grass-=g;s.coins-=c;s.stall++;s.influence+=5;save();main();toast("Stall upgraded!")}
function herd(){return '<section class="section"><h1>🤝 The Open Gate</h1><div class="card"><h2>“The Shepherd calls it unity. We call it organizing.”</h2><p>The first resistance organization in PEACEHOLD.</p>'+(s.herd?'<b>Member of The Open Gate</b>':'<button class="btn" onclick="s.herd=true;s.awareness=Math.min(100,s.awareness+5);save();main();toast(\'Welcome to the Open Gate\')">Join the Herd</button>')+'</div><div class="card"><h3>Coming next</h3>Player-created herds, guild wars, shared treasury, elected officials and multiplayer missions.</div></section>'}
setInterval(()=>{if(s.job)main()},1000);main();
</script></html>
