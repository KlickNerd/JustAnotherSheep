/* PEACEHOLD v0.2 — cinematic illustrated Farm hub */
:root{--bg:#1b1512;--panel:#eee0c4;--gold:#d9b377}
body{background:#100e0d;color:#f2e6d2}
.app{background:#1b1714}

</style><div class="app"><header><div><b>🐑 <span id="name">Sheep #127</span></b><div class="muted" id="lvl">Lv 1</div></div><div class="res"><span>🌿 <b id="grass"></b></span><span>☁️ <b id="wool"></b></span><span>🪙 <b id="coins"></b></span><span>⚡ <b id="energy"></b></span></div></header><main id="main"></main><nav id="nav"></nav></div><div id="alert" hidden></div><script>
const K="peacehold-mobile-v1",initial={level:1,xp:0,grass:90,wool:12,coins:220,energy:100,awareness:5,suspicion:0,influence:10,stall:1,skills:{Wit:1,Grit:1,Charm:1,Sneak:1},herd:false,vote:null,job:null,last:Date.now()};
let s;try{s={...initial,...JSON.parse(localStorage.getItem(K))}}catch{s={...initial}}let page="Farm",category="All";const jobs=[["Gather Grass","Civic",12,5,{grass:50,wool:2},15],["Deliver Wool Tax","Loyalist",20,10,{coins:130,influence:8},20],["Clean Bell Tower","Civic",18,8,{coins:100},18],["Distribute Approved Pamphlets","Loyalist",24,10,{coins:150,influence:12},25],["Pass a Hidden Message","Underground",30,15,{coins:170,awareness:12,suspicion:8},30]];
function save(){localStorage.setItem(K,JSON.stringify(s))}function toast(t){let a=document.querySelector("#alert");a.textContent=t;a.hidden=false;setTimeout(()=>a.hidden=true,3100)}function tick(){let n=Date.now(),gain=Math.floor((n-s.last)/60000);if(gain>0){s.energy=Math.min(100,s.energy+gain);s.last+=gain*60000}if(s.job&&n>=s.job.end){let j=jobs[s.job.id];Object.entries(j[4]).forEach(([k,v])=>s[k]=(s[k]||0)+v);s.xp+=j[5];while(s.xp>=s.level*100){s.xp-=s.level*100;s.level++;s.energy=Math.min(100,s.energy+15)}s.job=null;toast("Job complete! Rewards collected.")}save()}function meter(t,v){return '<span>'+t+' '+v+'/100</span><div class="meter"><i style="width:'+v+'%"></i></div>'}function main(){tick();["grass","wool","coins","energy"].forEach(k=>document.getElementById(k).textContent=s[k]);document.getElementById("lvl").textContent="Lv "+s.level+" · "+s.xp+"/"+s.level*100+" XP";document.getElementById("nav").innerHTML=[["Farm","🏡"],["Society","🏛️"],["Jobs","⚒️"],["Sheep","🐑"],["Herd","🤝"]].map(([t,e])=>'<button class="'+(page===t?'active':'')+'" onclick="go(\''+t+'\')">'+e+'<br>'+t+'</button>').join('');document.getElementById("main").innerHTML=({Farm:farm,Society:society,Jobs:jobpage,Sheep:sheep,Herd:herd})[page]()}function go(x){page=x;main();window.scrollTo(0,0)}
function farm(){return '<div class="scene"><div class="hills"></div><div class="path"></div><div class="barn left"></div><div class="barn right"></div><div class="tower">🔔</div><div class="herohead"><small>PEACEHOLD PRESENTS</small><h1>JUST ANOTHER SHEEP</h1><b>A safer flock. A brighter tomorrow.</b></div><button class="pin a" onclick="go(\'Society\')">Bell Tower</button><button class="pin b" onclick="go(\'Jobs\')">Market</button><button class="pin c" onclick="go(\'Society\')">Tax Office</button><button class="pin d" onclick="go(\'Sheep\')">Your Stall</button><button class="pin e" onclick="go(\'Herd\')">The Open Gate</button></div><div class="meters">'+meter("Awareness",s.awareness)+meter("Suspicion",s.suspicion)+'</div><div class="intro"><h3>🔔 Official Announcement</h3>The Shepherd is pleased to announce a proposal to increase wool taxes by 5%. <button class="btn" onclick="go(\'Society\')">Vote now</button></div>'}
function jobpage(){const img=['/images/home/story-meadow.webp','/images/home/barn-mobile.webp','/images/home/story-tower.webp','/images/home/classroom-mobile.webp','/images/home/fence-night.webp'];return '<div class="section jobs-view"><div class="wood-heading"><h1>⚒️ JOBS</h1><small>WORK TODAY. A BRIGHTER TOMORROW.</small></div>'+(s.job?'<div class="card"><b>⏳ '+jobs[s.job.id][0]+'</b><p>Time remaining: '+Math.max(0,Math.ceil((s.job.end-Date.now())/1000))+'s</p></div>':'')+'<div class="tabs">'+["All","Civic","Loyalist","Underground"].map(x=>'<button class="btn '+(x===category?'':'alt')+'" onclick="category=\\''+x+'\\';main()">'+(x==='All'?'All Jobs':x)+'</button>').join('')+'</div>'+jobs.map((j,i)=>category!=="All"&&j[1]!==category?"":'<div class="card job-card"><img class="job-art" src="'+img[i]+'" alt=""><div><h3 class="job-title">'+j[0]+'</h3><p class="muted">⏱ '+j[2]+' sec · ⚡ '+j[3]+' · '+j[1]+'</p><div class="reward-line">'+Object.entries(j[4]).map(([k,v])=>'<span>+'+v+' '+k+'</span>').join('')+'<span>+'+j[5]+' XP</span></div><button class="btn" '+(s.job||s.energy<j[3]?'disabled':'')+' onclick="start('+i+')">Start Job ›</button></div></div>').join('')+'</div>'}
function start(i){tick();let j=jobs[i];if(s.job||s.energy<j[3])return;s.energy-=j[3];s.job={id:i,end:Date.now()+j[2]*1000};save();main();toast("The Shepherd appreciates your productivity.")}
function society(){return '<section class="section society-view"><h1>🏛️ Weekly Assembly</h1><div class="card"><h2>Raise Wool Tax by 5%</h2><p>For infrastructure, public happiness, and absolutely necessary extra watchtowers.</p><p>“All sheep have a voice. Some voices are more official.”</p><div class="row"><button class="btn alt" '+(s.vote?'disabled':'')+' onclick="vote(\'Support\')">Support</button><button class="btn red" '+(s.vote?'disabled':'')+' onclick="vote(\'Oppose\')">Oppose</button><button class="btn" '+(s.vote?'disabled':'')+' onclick="vote(\'Manipulate\')">Manipulate</button></div><p>'+ (s.vote?'Your choice: '+s.vote:'Choose carefully. The Shepherd is watching.')+'</p><p class="muted">Simulated local vote. Online multiplayer elections are not implemented.</p></div><div class="card"><h3>Your Influence</h3><div class="big">'+s.influence+'</div><p>Awareness: '+s.awareness+' · Suspicion: '+s.suspicion+'</p></div><div class="card"><h3>Civic Roles</h3><p>🔔 Bell Keeper (20 Influence)</p><p>🧾 Tax Collector (80 Influence)</p><p>📜 Council Clerk (150 Influence)</p><p>👑 Council Speaker (500 Influence)</p></div></section>'}
function vote(c){if(s.vote)return;s.vote=c;if(c==="Support"){s.influence+=12;s.coins+=40}else if(c==="Oppose"){s.influence+=18;s.awareness+=10;s.suspicion+=5}else{s.influence+=30;s.suspicion+=20;s.coins=Math.max(0,s.coins-35)}s.awareness=Math.min(100,s.awareness);s.suspicion=Math.min(100,s.suspicion);save();main();toast("Your choice has been officially recorded.")}
function sheep(){return '<section class="section sheep-view"><div class="wood-heading"><h1>🐑 SHEEP #127</h1><small>QUESTIONING WORKER · LEVEL '+s.level+'</small></div><div class="profile-art"></div><div class="card"><h2>Character Attributes</h2><p><i>Same flock. Different path.</i></p>'+Object.entries(s.skills).map(([k,v])=>'<div class="game-stat"><strong>'+k+'</strong><div class="meter"><i style="width:'+Math.min(100,12*v)+'%"></i></div><b>'+v+'</b></div><button class="btn" '+(s.coins<50*v?'disabled':'')+' onclick="train(\\''+k+'\\')">+ '+50*v+' 🪙</button>').join('')+'</div><div class="card"><h2>Awareness & Suspicion</h2>'+meter('👁 Awareness',s.awareness)+meter('🛡 Suspicion',s.suspicion)+'</div><div class="card"><h2>Reputation & Influence</h2><p>⭐ Influence: '+s.influence+'</p><p>Role: Worker · Allegiance: '+(s.herd?'The Open Gate':'Independent')+'</p></div><div class="card"><h2>🏠 Your Stall · Level '+s.stall+'</h2><p>Your quiet place to rest and plan.</p><button class="btn" '+(s.grass<50*s.stall||s.coins<80*s.stall?'disabled':'')+' onclick="upgrade()">Upgrade Stall · 🌿 '+50*s.stall+' / 🪙 '+80*s.stall+'</button></div></section>'}
function train(k){let c=50*s.skills[k];if(s.coins<c)return;s.coins-=c;s.skills[k]++;s.influence+=2;save();main();toast("Training complete!")}function upgrade(){let g=50*s.stall,c=80*s.stall;if(s.grass<g||s.coins<c)return;s.grass-=g;s.coins-=c;s.stall++;s.influence+=5;save();main();toast("Stall upgraded!")}
function herd(){return '<section class="section herd-view"><div class="wood-heading"><h1>THE OPEN GATE</h1><small>MORE SHEEP. SAFER TOMORROWS.</small></div><div class="herd-art"></div><div class="card"><h2>🤝 The Open Gate</h2><p><b>Herd Level 1</b> · 1/20 members</p><p><i>“The Shepherd calls it unity. We call it organizing.”</i></p>'+(s.herd?'<b>✓ Member of The Open Gate</b>':'<button class="btn" onclick="s.herd=true;s.awareness=Math.min(100,s.awareness+5);save();main();toast(\\'Welcome to the Open Gate\\')">Join the Herd</button>')+'</div><div class="card"><h2>Herd Members</h2><div class="member-row"><div class="member">🐑<br>Sheep #127<br>Online</div><div class="member">🔒<br>Awaiting<br>players</div><div class="member">🔒<br>Awaiting<br>players</div></div></div><div class="card"><h2>📜 Herd Missions</h2><p>Smuggle Grain · Spread a Rumor · Scout the Old Fence</p><p class="muted">Multiplayer missions are planned. Not available in this local demo.</p></div><div class="card"><h2>⚔️ Farm Rivalries</h2><p>Red Barn Crew · Henhouse United · Pasture Runaways</p><p class="muted">PvP will unlock with the online multiplayer backend.</p></div></section>'}
setInterval(()=>{if(s.job)main()},1000);main();
</script></html>
