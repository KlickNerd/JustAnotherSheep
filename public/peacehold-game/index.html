function save(){localStorage.setItem(K,JSON.stringify(s))}function toast(t){let a=document.querySelector("#alert");a.textContent=t;a.hidden=false;setTimeout(()=>a.hidden=true,3100)}function tick(){let n=Date.now();let prod=Math.min(240,Math.max(0,Math.floor((n-s.lastProduction)/120000)));if(prod>0){s.stallStock=Math.min(240*(s.stall+plotProductionCount('workshop')), s.stallStock+prod*(s.stall*3+2*plotProductionCount('workshop')));s.lastProduction+=prod*120000}let gain=Math.floor((n-s.last)/60000);if(gain>0){s.energy=Math.min(100,s.energy+gain);s.last+=gain*60000}if(s.job&&n>=s.job.end){let j=jobs[s.job.id];Object.entries(j[4]).forEach(([k,v])=>s[k]=(s[k]||0)+v);s.xp+=j[5];while(s.xp>=s.level*100){s.xp-=s.level*100;s.level++;s.energy=Math.min(100,s.energy+15)}s.job=null;toast("Job complete! Rewards collected.")}save()}function meter(t,v){return '<span>'+t+' '+v+'/100</span><div class="meter"><i style="width:'+v+'%"></i></div>'}function main(){tick();["grass","wool","coins","energy"].forEach(k=>document.getElementById(k).textContent=s[k]);document.getElementById("lvl").textContent="Lv "+s.level+" · "+s.xp+"/"+s.level*100+" XP";document.getElementById("nav").innerHTML=[["Farm","🏡"],["Society","🏛️"],["Jobs","⚒️"],["Sheep","🐑"],["Herd","🤝"]].map(([t,e])=>'<button class="'+(page===t?'active':'')+'" onclick="go(\''+t+'\')">'+e+'<br>'+t+'</button>').join('');document.getElementById("main").innerHTML=({Farm:farm,Society:society,Jobs:jobpage,Sheep:sheep,Herd:herd})[page]()}function go(x){page=x;main();window.scrollTo(0,0)}

const PLOT_ITEMS={stall:{name:'Stall',icon:'🏠',grass:0,coins:0},garden:{name:'Grass Garden',icon:'🌾',grass:35,coins:40},workshop:{name:'Wool Shed',icon:'🧶',grass:65,coins:100},tree:{name:'Apple Tree',icon:'🌳',grass:20,coins:25},fence:{name:'Fence',icon:'🪵',grass:10,coins:15}};
if(!Array.isArray(s.plotItems)||!s.plotItems.some(i=>i.type==='stall'))s.plotItems=[{type:'stall',pos:14}];
s.plotItems=s.plotItems.filter(i=>i&&PLOT_ITEMS[i.type]&&Number.isInteger(i.pos)&&i.pos>=0&&i.pos<36);
s.plotItems=s.plotItems.filter((i,idx,arr)=>arr.findIndex(v=>v.pos===i.pos)===idx);
s.plotItems=s.plotItems.filter((i,idx,arr)=>i.type!=='stall'||arr.findIndex(v=>v.type==='stall')===idx);
if(!s.plotItems.some(i=>i.type==='stall'))s.plotItems.push({type:'stall',pos:14});
s.plotMode=null;s.plotSelected=null;

function plotIcon(type){
const base='<ellipse cx="50" cy="91" rx="40" ry="8" fill="#26371d" opacity=".35"/>';
let art={
stall:'<path d="M16 45 49 16 84 45 79 52 49 27 21 52Z" fill="#85472d" stroke="#34241a" stroke-width="3"/><rect x="24" y="46" width="51" height="39" rx="2" fill="#d9b984" stroke="#60452b" stroke-width="3"/><path d="M20 49 49 23 79 49" stroke="#b97847" stroke-width="8" fill="none"/><rect x="42" y="61" width="16" height="24" rx="2" fill="#62432b" stroke="#e7d4aa" stroke-width="3"/><rect x="29" y="54" width="9" height="11" fill="#9fc3b4" stroke="#694d35" stroke-width="2"/><rect x="63" y="54" width="8" height="11" fill="#9fc3b4" stroke="#694d35" stroke-width="2"/><path d="M72 24V11H79V30" fill="#996041" stroke="#503524" stroke-width="2"/>',
garden:'<path d="M10 78 50 58 91 79 50 93Z" fill="#715131" stroke="#34261d" stroke-width="3"/><path d="M23 77 51 65 80 78 50 88Z" fill="#638048"/><path d="M31 78 25 58M49 78 46 43M65 76 73 55" stroke="#558e40" stroke-width="5" stroke-linecap="round"/><path d="M25 58q-18-14-9-27 19 5 13 25M46 44q-13-22 4-30 14 15-3 31M72 55q-4-22 13-25 9 19-11 29" fill="#ccb65d" stroke="#796f30" stroke-width="2"/>',
workshop:'<path d="M10 48 49 18 90 48 84 55 49 31 15 55Z" fill="#89482a" stroke="#423025" stroke-width="3"/><rect x="18" y="49" width="64" height="38" fill="#b58b5e" stroke="#5a3b2d" stroke-width="3"/><path d="M17 56H83M17 68H83M27 49V85M75 49V85" stroke="#755037" stroke-width="3"/><rect x="41" y="58" width="22" height="28" fill="#533a2b" stroke="#d4b17b" stroke-width="3"/><circle cx="51" cy="73" r="9" fill="#e7dabe" stroke="#c0a17a" stroke-width="2"/><path d="M44 73q6-10 14 0M45 78q6-9 13-1" stroke="#ac9072" stroke-width="2" fill="none"/>',
tree:'<path d="M46 59V85H55V55" fill="#785035" stroke="#493422" stroke-width="3"/><circle cx="48" cy="39" r="26" fill="#46693c" stroke="#2d4528" stroke-width="3"/><circle cx="33" cy="47" r="17" fill="#64874b"/><circle cx="63" cy="44" r="18" fill="#527a42"/><circle cx="42" cy="27" r="19" fill="#789451"/><circle cx="35" cy="49" r="4" fill="#c5673b"/><circle cx="63" cy="40" r="4" fill="#cd6040"/><circle cx="46" cy="28" r="4" fill="#ca5c37"/>',
fence:'<path d="M15 80V37L26 30V81M70 80V37L81 30V81" fill="#a47b51" stroke="#563a27" stroke-width="3"/><path d="M11 45 88 49 87 58 11 54ZM11 65 88 69 87 77 11 73Z" fill="#c5a172" stroke="#6b462c" stroke-width="2"/><path d="M18 33 18 81M73 33 73 81" stroke="#e1ba84" stroke-width="2"/>'
};return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+base+(art[type]||art.stall)+'</svg>'
}
function plotProductionCount(type){return s.plotItems.filter(i=>i.type===type).length}
function plot(){let g=50*s.stall,c=80*s.stall,ready=Date.now()-s.lastHarvest>=45000,remaining=Math.max(0,Math.ceil((45000-(Date.now()-s.lastHarvest))/1000)),garden=plotProductionCount('garden'),shed=plotProductionCount('workshop');let cells=Array.from({length:36},(_,pos)=>{let o=s.plotItems.find(x=>x.pos===pos),d=o?PLOT_ITEMS[o.type]:null,sel=s.plotSelected===pos;return '<button class="land-cell '+(sel?'selected ':'')+(s.plotMode&&!o?'available':'')+'" aria-label="'+(d?d.name:'Empty tile')+'" onclick="plotTap('+pos+')">'+(d?'<span class="object '+(o.type==='workshop'&&s.stallStock?'ready':'')+'"><span class="art">'+plotIcon(o.type)+'</span><small>'+d.name+'</small></span>':'')+'</button>'}).join('');let items=['garden','workshop','tree','fence'].map(key=>{let d=PLOT_ITEMS[key],active=s.plotMode===key,ok=s.grass>=d.grass&&s.coins>=d.coins;return '<button class="build-offer '+(active?'on':'')+'" '+(!ok?'disabled':'')+' onclick="selectBuilding(\''+key+'\')"><span class="build-icon">'+plotIcon(key)+'</span>'+d.name+'<small>🌿 '+d.grass+' · 🪙 '+d.coins+'</small></button>'}).join('');return '<section class="plot-wrap"><div class="plot-heading"><div><small>YOUR OWN PIECE OF PEACEHOLD</small><h2>🏡 My Little Plot</h2></div><b>LV '+s.stall+'</b></div><div class="land-board" role="group" aria-label="Interactive six by six farm plot">'+cells+'</div><p class="land-board-hint">Tap a building to select and move it. Choose a building below, then tap an empty tile to build.</p><div class="land-status">'+(s.plotMode?'🔨 Placing '+PLOT_ITEMS[s.plotMode].name+' — tap an empty tile.':s.plotSelected!==null?'📍 Selected '+PLOT_ITEMS[s.plotItems.find(x=>x.pos===s.plotSelected)?.type||'stall'].name+'. Tap an empty tile to move it.':'🌱 '+s.plotItems.length+' objects on your plot · '+(3*s.stall+2*shed)+' Wool / 2 min · '+garden+' gardens')+'</div><div class="land-controls"><button class="btn" '+(ready?'':'disabled')+' onclick="harvestGrass()">🌿 Forage Meadow<br><small>'+(ready?'25 Grass':'Ready in '+remaining+'s')+'</small></button><button class="btn alt" '+(s.stallStock?'':'disabled')+' onclick="collectStall()">🧶 Collect '+s.stallStock+' Wool</button><button class="btn alt" onclick="clearPlotMode()">✖ Cancel Selection</button></div><div class="plot-progress"><h3>🛠 Build on Your Land</h3><p>Buy a structure, then choose where to place it. Grass Gardens yield <b>+10 Grass</b> per meadow harvest. Each Wool Shed produces <b>+2 Wool</b> every 2 minutes.</p><div class="build-market">'+items+'</div><h3>Upgrade Your Stall</h3><p>Stall LV '+s.stall+' · Produces '+s.stall*3+' Wool / 2 min. Upgrading boosts production and character progression.</p><span class="plot-tag">🌿 '+s.grass+' / '+g+' · 🪙 '+s.coins+' / '+c+'</span><button class="btn plot-cta" '+(s.grass<g||s.coins<c?'disabled':'')+' onclick="upgrade()">🔨 Upgrade Stall · '+g+' 🌿 + '+c+' 🪙</button><p><small>Prototype: 6×6 tile plot, tap-to-place and tap-to-move. Buildings and resources are saved on this device.</small></p></div></section>'}
function selectBuilding(key){if(!PLOT_ITEMS[key]||key==='stall')return;let d=PLOT_ITEMS[key];if(s.coins<d.coins||s.grass<d.grass)return;s.plotMode=key;s.plotSelected=null;main()}
function clearPlotMode(){s.plotMode=null;s.plotSelected=null;main()}
function plotTap(pos){let obj=s.plotItems.find(i=>i.pos===pos);if(s.plotMode){if(obj)return toast('This tile is occupied.');let d=PLOT_ITEMS[s.plotMode];if(s.grass<d.grass||s.coins<d.coins)return clearPlotMode();s.grass-=d.grass;s.coins-=d.coins;s.plotItems.push({type:s.plotMode,pos});s.plotMode=null;s.xp+=12;save();main();return toast('Building placed! +12 XP')}if(s.plotSelected!==null){if(s.plotSelected===pos){s.plotSelected=null;return main()}if(obj){s.plotSelected=pos;return main()}let move=s.plotItems.find(i=>i.pos===s.plotSelected);if(move)move.pos=pos;s.plotSelected=null;save();main();return toast('Building moved!')}if(obj){s.plotSelected=pos;main()}else toast('Select a building from the shop to place it.')}
function harvestGrass(){tick();if(Date.now()-s.lastHarvest<45000)return;s.grass+=25+10*plotProductionCount('garden');s.xp+=8;s.lastHarvest=Date.now();save();main();toast('Meadow harvested! +25 Grass · +8 XP')}
function collectStall(){tick();if(!s.stallStock)return;let n=s.stallStock;s.wool+=n;s.stallStock=0;save();main();toast('Collected '+n+' Wool from your stall!')}
function farm(){return '<div class="scene"><div class="herohead"><small>PEACEHOLD PRESENTS</small><h1>JUST ANOTHER SHEEP</h1><b>A safer flock. A brighter tomorrow.</b></div><button class="pin a" onclick="go(\'Society\')">🔔 Bell Tower</button><button class="pin b" onclick="go(\'Jobs\')">⚒ Market</button><button class="pin c" onclick="go(\'Society\')">📜 Tax Office</button><button class="pin d" onclick="document.querySelector(\'.plot-wrap\').scrollIntoView({behavior:\'smooth\'})">🏠 Your Stall ↓</button><button class="pin e" onclick="go(\'Herd\')">🚪 The Open Gate</button></div><div class="meters">'+meter("Awareness",s.awareness)+meter("Suspicion",s.suspicion)+'</div>'+plot()+'<div class="intro"><h3>🔔 Official Announcement</h3>The Shepherd is pleased to announce a proposal to increase wool taxes by 5%. <button class="btn" onclick="go(\'Society\')">Vote now</button></div>'}
function jobpage(){const img=['/images/home/story-meadow.webp','/images/home/barn-mobile.webp','/images/home/story-tower.webp','/images/home/classroom-mobile.webp','/images/home/fence-night.webp'];return '<div class="section jobs-view"><div class="wood-heading"><h1>⚒️ JOBS</h1><small>WORK TODAY. A BRIGHTER TOMORROW.</small></div>'+(s.job?'<div class="card"><b>⏳ '+jobs[s.job.id][0]+'</b><p>Time remaining: '+Math.max(0,Math.ceil((s.job.end-Date.now())/1000))+'s</p></div>':'')+'<div class="tabs">'+["All","Civic","Loyalist","Underground"].map(x=>'<button class="btn '+(x===category?'':'alt')+'" onclick="category=\''+x+'\';main()">'+(x==='All'?'All Jobs':x)+'</button>').join('')+'</div>'+jobs.map((j,i)=>category!=="All"&&j[1]!==category?"":'<div class="card job-card"><img class="job-art" src="'+img[i]+'" alt=""><div><h3 class="job-title">'+j[0]+'</h3><p class="muted">⏱ '+j[2]+' sec · ⚡ '+j[3]+' · '+j[1]+'</p><div class="reward-line">'+Object.entries(j[4]).map(([k,v])=>'<span>+'+v+' '+k+'</span>').join('')+'<span>+'+j[5]+' XP</span></div><button class="btn" '+(s.job||s.energy<j[3]?'disabled':'')+' onclick="start('+i+')">Start Job ›</button></div></div>').join('')+'</div>'}
function start(i){tick();let j=jobs[i];if(s.job||s.energy<j[3])return;s.energy-=j[3];s.job={id:i,end:Date.now()+j[2]*1000};save();main();toast("The Shepherd appreciates your productivity.")}
function society(){return '<section class="section society-view"><h1>🏛️ Weekly Assembly</h1><div class="card"><h2>Raise Wool Tax by 5%</h2><p>For infrastructure, public happiness, and absolutely necessary extra watchtowers.</p><p>“All sheep have a voice. Some voices are more official.”</p><div class="row"><button class="btn alt" '+(s.vote?'disabled':'')+' onclick="vote(\'Support\')">Support</button><button class="btn red" '+(s.vote?'disabled':'')+' onclick="vote(\'Oppose\')">Oppose</button><button class="btn" '+(s.vote?'disabled':'')+' onclick="vote(\'Manipulate\')">Manipulate</button></div><p>'+ (s.vote?'Your choice: '+s.vote:'Choose carefully. The Shepherd is watching.')+'</p><p class="muted">Simulated local vote. Online multiplayer elections are not implemented.</p></div><div class="card"><h3>Your Influence</h3><div class="big">'+s.influence+'</div><p>Awareness: '+s.awareness+' · Suspicion: '+s.suspicion+'</p></div><div class="card"><h3>Civic Roles</h3><p>🔔 Bell Keeper (20 Influence)</p><p>🧾 Tax Collector (80 Influence)</p><p>📜 Council Clerk (150 Influence)</p><p>👑 Council Speaker (500 Influence)</p></div></section>'}
function vote(c){if(s.vote)return;s.vote=c;if(c==="Support"){s.influence+=12;s.coins+=40}else if(c==="Oppose"){s.influence+=18;s.awareness+=10;s.suspicion+=5}else{s.influence+=30;s.suspicion+=20;s.coins=Math.max(0,s.coins-35)}s.awareness=Math.min(100,s.awareness);s.suspicion=Math.min(100,s.suspicion);save();main();toast("Your choice has been officially recorded.")}
function sheep(){return '<section class="section sheep-view"><div class="wood-heading"><h1>🐑 SHEEP #127</h1><small>QUESTIONING WORKER · LEVEL '+s.level+'</small></div><div class="profile-art"></div><div class="card"><h2>Character Attributes</h2><p><i>Same flock. Different path.</i></p>'+Object.entries(s.skills).map(([k,v])=>'<div class="game-stat"><strong>'+k+'</strong><div class="meter"><i style="width:'+Math.min(100,12*v)+'%"></i></div><b>'+v+'</b></div><button class="btn" '+(s.coins<50*v?'disabled':'')+' onclick="train(\''+k+'\')">+ '+50*v+' 🪙</button>').join('')+'</div><div class="card"><h2>Awareness & Suspicion</h2>'+meter('👁 Awareness',s.awareness)+meter('🛡 Suspicion',s.suspicion)+'</div><div class="card"><h2>Reputation & Influence</h2><p>⭐ Influence: '+s.influence+'</p><p>Role: Worker · Allegiance: '+(s.herd?'The Open Gate':'Independent')+'</p></div><div class="card"><h2>🏠 Your Stall · Level '+s.stall+'</h2><p>Your quiet place to rest and plan.</p><button class="btn" '+(s.grass<50*s.stall||s.coins<80*s.stall?'disabled':'')+' onclick="upgrade()">Upgrade Stall · 🌿 '+50*s.stall+' / 🪙 '+80*s.stall+'</button></div></section>'}
function train(k){let c=50*s.skills[k];if(s.coins<c)return;s.coins-=c;s.skills[k]++;s.influence+=2;save();main();toast("Training complete!")}function upgrade(){let g=50*s.stall,c=80*s.stall;if(s.grass<g||s.coins<c)return;s.grass-=g;s.coins-=c;s.stall++;s.influence+=5;s.xp+=30;save();main();toast("Stall upgraded! +30 XP · More Wool production!")}
function herd(){return '<section class="section herd-view"><div class="wood-heading"><h1>THE OPEN GATE</h1><small>MORE SHEEP. SAFER TOMORROWS.</small></div><div class="herd-art"></div><div class="card"><h2>🤝 The Open Gate</h2><p><b>Herd Level 1</b> · 1/20 members</p><p><i>“The Shepherd calls it unity. We call it organizing.”</i></p>'+(s.herd?'<b>✓ Member of The Open Gate</b>':'<button class="btn" onclick="s.herd=true;s.awareness=Math.min(100,s.awareness+5);save();main();toast(\'Welcome to the Open Gate\')">Join the Herd</button>')+'</div><div class="card"><h2>Herd Members</h2><div class="member-row"><div class="member">🐑<br>Sheep #127<br>Online</div><div class="member">🔒<br>Awaiting<br>players</div><div class="member">🔒<br>Awaiting<br>players</div></div></div><div class="card"><h2>📜 Herd Missions</h2><p>Smuggle Grain · Spread a Rumor · Scout the Old Fence</p><p class="muted">Multiplayer missions are planned. Not available in this local demo.</p></div><div class="card"><h2>⚔️ Farm Rivalries</h2><p>Red Barn Crew · Henhouse United · Pasture Runaways</p><p class="muted">PvP will unlock with the online multiplayer backend.</p></div></section>'}
setInterval(()=>{if(s.job)main()},1000);main();
</script></html>
